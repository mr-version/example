name: Manual Release

# Versions come from the commit history (Conventional Commits, see mr-version.yml); this workflow lets you
# choose a prerelease type for the run or force an exact version.
on:
  workflow_dispatch:
    inputs:
      prerelease-type:
        description: 'Prerelease type (none = final version)'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - alpha
          - beta
          - rc
      force-version:
        description: 'Force this exact version (e.g. 2.0.0); leave empty to use the calculated version'
        required: false
        default: ''

permissions:
  contents: write

env:
  # Keep in sync with the Mister.Version package version in Directory.Build.targets
  MR_VERSION: '3.0.0'

jobs:
  release:
    name: Create Manual Release
    runs-on: ubuntu-latest
    env:
      # The same settings for the mr-version actions and the MSBuild package, so both calculate the same versions
      PRERELEASE_TYPE: ${{ github.event.inputs.prerelease-type }}
      FORCE_VERSION: ${{ github.event.inputs.force-version }}
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Mr. Version
        uses: mr-version/setup@main
        with:
          version: ${{ env.MR_VERSION }}

      - name: Calculate Version
        id: version
        uses: mr-version/calculate@main
        with:
          projects: 'src/**/*.csproj'
          config-file: 'mr-version.yml'
          prerelease-type: ${{ env.PRERELEASE_TYPE }}
          force-version: ${{ env.FORCE_VERSION }}

      - name: Select the package version
        id: library
        env:
          PROJECTS: ${{ steps.version.outputs.projects }}
        run: |
          version=$(jq -r '.[] | select(.project == "ExampleLibrary") | .version' <<<"$PROJECTS")
          echo "ExampleLibrary: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build Projects
        run: |
          dotnet build --configuration Release \
            -p:MonoRepoPrereleaseType="$PRERELEASE_TYPE" \
            -p:ForceVersion="$FORCE_VERSION"

      - name: Run Tests
        run: dotnet test --no-build --configuration Release

      - name: Pack NuGet Packages
        run: |
          dotnet pack src/ExampleLibrary/ExampleLibrary.csproj --configuration Release --no-build \
            -p:MonoRepoPrereleaseType="$PRERELEASE_TYPE" \
            -p:ForceVersion="$FORCE_VERSION" \
            -o ./artifacts
          ls artifacts

      # Tags exactly the versions calculated above and pushes only the new tags
      - name: Create Version Tags
        id: tag
        uses: mr-version/tag@main
        with:
          projects-json: ${{ steps.version.outputs.projects }}
          tag-prefix: 'v'
          create-global-tags: 'true'
          global-tag-strategy: 'all'
          tag-message-template: 'Manual release {version} for {project}'
          only-changed: 'true'
          push-tags: 'true'

      - name: Generate Release Notes
        id: notes
        uses: mr-version/changelog@main
        with:
          to-version: ${{ steps.library.outputs.version }}
          repository-url: ${{ github.server_url }}/${{ github.repository }}
          output-file: RELEASE_NOTES.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.library.outputs.version }}
          NOTES_FILE: ${{ steps.notes.outputs.changelog-file }}
        run: |
          args=(--title "Release ${VERSION}" --notes-file "$NOTES_FILE" --verify-tag)
          if [[ "$VERSION" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "v${VERSION}" artifacts/*.nupkg "${args[@]}"

      - name: Publish to NuGet
        if: ${{ !contains(steps.library.outputs.version, '-') && env.NUGET_API_KEY != '' }}
        run: |
          dotnet nuget push artifacts/*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
